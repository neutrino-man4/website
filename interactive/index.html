<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive — Dr. Aritra Bal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../icons/etp_logo_color_de.png">
  <style>
    :root {
      --cream:      #f5f3ef;
      --sage:       #7a9e7e;
      --sage-dark:  #5a7a5d;
      --ink:        #1c1e1b;
      --ink-muted:  #4a4d48;
      --white:      #ffffff;
      --accent:     #4d7a52;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans:  'DM Sans', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--font-sans);
      padding: 1.5rem;
    }

    .card {
      text-align: center;
      max-width: 480px;
      animation: fadeUp 0.6s ease both;
    }

    .card__heading {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      color: var(--ink);
      line-height: 1.4;
      margin: 0 0 2rem;
    }

    .card__link {
      display: inline-block;
      padding: 0.7rem 2rem;
      border: 1px solid var(--sage);
      border-radius: 4px;
      color: var(--accent);
      background: var(--white);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      transition: border-color 0.25s ease, background 0.25s ease, color 0.25s ease;
    }

    .card__link:hover {
      border-color: var(--accent);
      background: var(--sage-dark);
      color: var(--white);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <main class="card">
    <p class="card__heading">Hi there, welcome to my (interactive) result visualization corner. Click below on the project you&rsquo;re interested in (unfortunately only in English).</p>
    <a href="1P1Q/index.html" class="card__link">1P1Q</a>
  </main>

</body>
</html>

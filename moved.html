<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="2;url=https://www.itp.kit.edu/~abal/" />
  <title>I've Moved — Dr. Aritra Bal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="icons/etp_logo_color_de.png">
  <style>
    :root {
      --cream:      #f5f3ef;
      --sage:       #7a9e7e;
      --sage-light: #a8c5ab;
      --sage-dark:  #5a7a5d;
      --ink:        #1c1e1b;
      --ink-muted:  #4a4d48;
      --white:      #ffffff;
      --accent:     #4d7a52;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans:  'DM Sans', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--font-sans);
      overflow: hidden;
      position: relative;
    }

    .deco {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2.5rem;
      max-width: 420px;
      animation: fadeUp 0.6s ease both;
    }

    .card__heading {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: clamp(2rem, 5vw, 2.6rem);
      color: var(--ink);
      margin: 0 0 0.75rem;
    }

    .card__sub {
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--ink-muted);
      line-height: 1.6;
      margin: 0 0 1.75rem;
    }

    .card__sub strong {
      color: var(--sage-dark);
      font-weight: 500;
    }

    .loader {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      margin-bottom: 1.75rem;
    }

    .loader span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--sage);
      animation: bounce 1.1s infinite ease-in-out both;
    }

    .loader span:nth-child(1) { animation-delay: -0.24s; }
    .loader span:nth-child(2) { animation-delay: -0.12s; }
    .loader span:nth-child(3) { animation-delay: 0s; }

    .card__fallback {
      font-size: 0.82rem;
      color: var(--ink-muted);
    }

    .card__fallback a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(77, 122, 82, 0.35);
      transition: border-color 0.25s ease;
    }

    .card__fallback a:hover {
      border-color: var(--accent);
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40%           { transform: scale(1);   opacity: 1;   }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <svg class="deco" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M-60 380 Q200 200 520 340 T900 260" stroke="#c8d5c0" stroke-width="1.2" fill="none" opacity="0.55"/>
    <path d="M-80 460 Q260 300 600 410 T960 310" stroke="#b8c9af" stroke-width="0.8" fill="none" opacity="0.35"/>
    <circle cx="820" cy="80"  r="180" fill="#e8ede4" opacity="0.35"/>
    <circle cx="760" cy="120" r="90"  fill="#d4dece" opacity="0.25"/>
  </svg>

  <main class="card">
    <h1 class="card__heading">I&rsquo;ve moved</h1>
    <p class="card__sub">Redirecting you to my <strong>ITP homepage</strong>&hellip;</p>
    <div class="loader" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="card__fallback">
      Not redirected? <a href="https://www.itp.kit.edu/~abal/">Click here</a>.
    </p>
  </main>

</body>
</html>
